name: Test link-dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  link:
    runs-on: ubuntu-latest
    env:
      HOME: ${{ github.workspace }}/test-home
    steps:
      - uses: actions/checkout@v4
      - run: bash link-dotfiles.sh
      - name: Verify symlinks point into the repo
        run: |
          for pair in zshrc:.zshrc starship.toml:.config/starship.toml kitty:.config/kitty \
                      nvim:.config/nvim bin/kitten:.local/bin/kitten bin/kshader:.local/bin/kshader; do
            src="$GITHUB_WORKSPACE/${pair%%:*}" dst="$HOME/${pair#*:}"
            [[ -L $dst && $(readlink -f "$dst") == $(readlink -f "$src") ]] || { echo "FAIL: $dst"; exit 1; }
            echo "OK $dst"
          done
