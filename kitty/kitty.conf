font_family      3270 Nerd Font
font_size        16.0
background_opacity 0.85
background_blur    30
window_padding_width 15
# --- Neon Cursor Effects ---
cursor_shape          beam
cursor_trail          3
cursor_trail_decay    0.1 0.4
# --- Window Behavior ---
hide_window_decorations titlebar-only
confirm_os_window_close 0
# Needed so Alfred's "presence" workflow can split a pane in an open Kitty.
allow_remote_control socket-only
listen_on unix:${HOME}/.cache/kitty/control
# macos_titlebar_color       background
macos_show_window_title_in none
# --- Tab Bar Aesthetic ---
tab_bar_style        powerline
# active_tab_foreground   #000
# active_tab_background   #eee

# Option+number jumps straight to that tab. On macOS, Option is not Alt unless this is set.
macos_option_as_alt yes
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# BEGIN_KITTY_THEME
# 1984 Light
include current-theme.conf
# END_KITTY_THEME
